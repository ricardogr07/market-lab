[tox]
env_list = lint, docs, typecheck, py312, py313, py314, integration, postgres, package, mcp-docker, preflight-fast, preflight-slow, preflight
skip_missing_interpreters = true
isolated_build = true
work_dir = {tox_root}{/}.tox

[testenv]
description = Run the fast deterministic unit suite through the bootstrapped Python environment
package = editable
extras = mcp
deps =
    pytest>=8.0
commands =
    {envpython} -c "from pathlib import Path; Path('artifacts/tmp').mkdir(parents=True, exist_ok=True)"
    {envpython} -m pytest -q tests/unit --basetemp artifacts/tmp/pytest-unit

[testenv:integration]
description = Run the offline integration test suite through the bootstrapped Python environment
basepython = py312
package = editable
deps =
    pytest>=8.0
commands =
    {envpython} -c "from pathlib import Path; Path('artifacts/tmp').mkdir(parents=True, exist_ok=True)"
    {envpython} -m pytest -q tests/integration -m "not real_data and not network" --basetemp artifacts/tmp/pytest-integration

[testenv:lint]
description = Run Ruff across the repository
basepython = py312
skip_install = true
deps =
    ruff>=0.11
commands =
    {envpython} -m ruff check .

[testenv:docs]
description = Build the MkDocs site with strict warnings
basepython = py312
skip_install = true
deps =
    mkdocs>=1.6
commands =
    {envpython} -m mkdocs build --strict

[testenv:terraform]
description = Format and validate Azure Terraform without configuring a backend
basepython = py312
skip_install = true
allowlist_externals = terraform
commands =
    terraform fmt -check -recursive {tox_root}{/}infra{/}azure
    terraform -chdir={tox_root}{/}infra{/}azure{/}bootstrap init -backend=false -lockfile=readonly -input=false
    terraform -chdir={tox_root}{/}infra{/}azure{/}bootstrap validate -no-color
    terraform -chdir={tox_root}{/}infra{/}azure{/}phase9-shadow init -backend=false -lockfile=readonly -input=false
    terraform -chdir={tox_root}{/}infra{/}azure{/}phase9-shadow validate -no-color
    terraform -chdir={tox_root}{/}infra{/}azure{/}qqq-paper init -backend=false -lockfile=readonly -input=false
    terraform -chdir={tox_root}{/}infra{/}azure{/}qqq-paper validate -no-color

[testenv:typecheck]
description = Run mypy across the current typed MarketLab module subset
basepython = py312
package = editable
deps =
    mypy>=1.20
commands =
    {envpython} -m mypy src/marketlab/config.py src/marketlab/log.py src/marketlab/data/market.py src/marketlab/shadow/contract.py src/marketlab/shadow/decision.py src/marketlab/shadow/journal.py src/marketlab/shadow/cli.py src/marketlab/paper/alpaca.py src/marketlab/paper/approval_clients.py src/marketlab/paper/notifications.py src/marketlab/paper/observability.py src/marketlab/paper/contracts.py src/marketlab/paper/outbox.py src/marketlab/paper/secrets.py src/marketlab/paper/service_bus.py src/marketlab/paper/state_import.py src/marketlab/paper/persistence/blob.py src/marketlab/paper/persistence/filesystem.py src/marketlab/paper/persistence/sqlite.py src/marketlab/paper/persistence/postgres.py src/marketlab/paper/application/decision.py src/marketlab/paper/application/approval.py src/marketlab/paper/application/submission.py src/marketlab/paper/application/reconciliation.py src/marketlab/paper/service.py src/marketlab/paper/agent.py src/marketlab/paper/scheduler.py src/marketlab/cli.py

[testenv:postgres]
description = Run PostgreSQL persistence and migration tests against the disposable Docker service
basepython = py312
package = editable
extras = mcp
deps =
    pytest>=8.0
allowlist_externals = docker
commands =
    {envpython} scripts/run_postgres_tests.py

[testenv:package]
description = Build source and wheel distributions
basepython = py312
skip_install = true
deps =
    build>=1.2
    setuptools>=69
    wheel
set_env =
    TMP = {tox_root}{/}.package-smoke
    TEMP = {tox_root}{/}.package-smoke
    TMPDIR = {tox_root}{/}.package-smoke
commands =
    {envpython} -m build --no-isolation
    {envpython} scripts/check_package.py

[testenv:mcp-docker]
description = Build the Docker image and exercise the MarketLab MCP stdio bridge through docker exec
basepython = py312
package = editable
extras = mcp
deps =
    anyio>=4.0
commands =
    {envpython} scripts/check_mcp_docker.py

[testenv:preflight-fast]
description = Run the fast local validation gate through the CI-aligned tox envs
basepython = py312
skip_install = true
env_dir = {work_dir}{/}.preflight-fast-local
deps =
    tox>=4.0
commands =
    {envpython} -m tox -e lint,docs,typecheck,py312

[testenv:preflight-slow]
description = Run the slow local validation gate through the CI-aligned tox envs
basepython = py312
skip_install = true
env_dir = {work_dir}{/}.preflight-slow-local
deps =
    tox>=4.0
commands =
    {envpython} -m tox -e package,integration

[testenv:preflight]
description = Run the local pre-push CI check set through the CI tox envs
basepython = py312
skip_install = true
env_dir = {work_dir}{/}.preflight-local
deps =
    tox>=4.0
commands =
    {envpython} -m tox -e lint,docs,typecheck,package,py312,integration
