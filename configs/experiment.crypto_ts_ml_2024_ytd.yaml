experiment_name: crypto_ts_ml_2024_ytd
data:
  symbols:
    - BTC-USD
  start_date: "2024-01-01"
  end_date: "2026-05-01"
  interval: "1h"
  cache_dir: artifacts/data-crypto-1h-2024_ytd_slow_meta
  prepared_panel_filename: btc_usd_1h_2024-01-01_2026-05-01.csv
features:
  return_windows: [12, 24, 72, 168]
  ma_windows: [24, 72, 168]
  vol_windows: [24, 72]
  momentum_window: 72
  crypto_time_series_enabled: true
  crypto_return_windows: [1, 3, 6, 12, 24, 72, 168]
  crypto_vol_windows: [12, 24, 72, 168]
  crypto_ma_windows: [12, 24, 72, 168]
  crypto_rsi_window: 14
  crypto_macd_fast_window: 12
  crypto_macd_slow_window: 26
  crypto_macd_signal_window: 9
  crypto_bollinger_window: 20
  crypto_bollinger_std: 2.0
  crypto_volume_window: 24
  crypto_time_features: true
target:
  horizon_days: 12
  type: direction
portfolio:
  ranking:
    long_n: 1
    short_n: 1
    rebalance_frequency: "bar"
    weighting: "equal"
    mode: "long_only"
    min_score_threshold: 0.55
    cash_when_underfilled: true
  costs:
    bps_per_trade: 10
baselines:
  buy_hold: true
  sma:
    enabled: false
  chart_patterns:
    enabled: true
    lookback_bars: 96
    level_tolerance_pct: 0.01
    breakout_pct: 0.001
    rectangle_max_range_pct: 0.05
    flag_pole_bars: 16
    flag_consolidation_bars: 12
    flag_min_pole_return: 0.015
    flag_max_retrace_pct: 0.012
    volume_window: 20
    volume_multiplier: 1.0
    min_bullish_patterns: 1
  pattern_exit_overlay:
    enabled: true
    min_bearish_patterns: 1
    min_bullish_reentry_patterns: 1
    trend_ema_window: 168
    reentry_clear_bars: 6
    require_price_below_trend_for_exit: true
    bearish_confirmation_window_bars: 6
    min_cash_bars: 12
    exit_cooldown_bars: 48
    reentry_requires_price_above_trend: false
  pattern_meta_label:
    enabled: true
    label_horizon_bars: 12
    exit_probability_threshold: 0.7
    exit_probability_threshold_grid: [0.65, 0.7]
    tuning_mode: nested_walk_forward
    tuning_objective: net_return_and_drawdown_vs_buy_hold
    min_oos_exit_count: 1
    max_average_exposure_for_active: 0.999
    models:
      - logistic_l1
      - gradient_boosting
  pattern_partial_exposure_overlay:
    enabled: true
    partial_weight: 0.5
    partial_exit_probability_threshold_grid: [0.6]
    full_exit_probability_threshold_grid: [0.75]
models:
  - name: logistic_l1
  - name: random_forest
  - name: extra_trees
  - name: gradient_boosting
  - name: hist_gradient_boosting
evaluation:
  benchmark_strategy: buy_hold
  periods_per_year: 8760
  cost_sensitivity_bps: [0, 5, 10, 20]
  ml_strategy_threshold_sweep:
    enabled: true
    thresholds: [0.50, 0.52, 0.55, 0.58, 0.60]
    min_exposure_changes: 5
    max_average_exposure_for_active: 0.995
  walk_forward:
    train_years: 1
    test_months: 3
    step_months: 3
    min_train_rows: 2000
    min_test_rows: 200
    min_train_positive_rate: 0.05
    min_test_positive_rate: 0.05
    embargo_periods: 12
paper:
  enabled: false
