experiment_name: crypto_indicator_ml_tuned_12h_2024_ytd
data:
  symbols:
    - BTC-USD
  start_date: "2024-01-01"
  end_date: "2026-05-01"
  interval: "1h"
  cache_dir: artifacts/data-crypto-1h-2024_ytd_slow_meta
  prepared_panel_filename: btc_usd_1h_2024-01-01_2026-05-01.csv
features:
  return_windows: [6, 12, 24, 72, 168]
  ma_windows: [24, 72, 168]
  vol_windows: [12, 24, 72]
  momentum_window: 24
  indicator_stack_ml_features_enabled: true
  crypto_time_series_enabled: true
  crypto_return_windows: [1, 3, 6, 12, 24, 72, 168]
  crypto_vol_windows: [12, 24, 72, 168]
  crypto_ma_windows: [12, 24, 72, 168]
  crypto_rsi_window: 14
  crypto_macd_fast_window: 12
  crypto_macd_slow_window: 26
  crypto_macd_signal_window: 9
  crypto_bollinger_window: 20
  crypto_bollinger_std: 2.0
  crypto_volume_window: 24
  crypto_time_features: true
target:
  horizon_days: 12
  type: direction
portfolio:
  ranking:
    long_n: 1
    short_n: 1
    rebalance_frequency: "bar"
    weighting: "equal"
    mode: "long_only"
    min_score_threshold: 0.55
    cash_when_underfilled: true
  costs:
    bps_per_trade: 10
baselines:
  buy_hold: true
  sma:
    enabled: false
  indicator_stack:
    enabled: true
    ema_fast_window: 12
    ema_slow_window: 26
    rsi_window: 14
    rsi_min: 45.0
    rsi_max: 70.0
    macd_fast_window: 12
    macd_slow_window: 26
    macd_signal_window: 9
    bollinger_window: 20
    bollinger_std: 2.0
    bollinger_mode: breakout
    volume_window: 24
    volume_multiplier: 1.0
    vwap_window: 24
    use_vwap: false
    min_confirmations: 3
models:
  - name: logistic_l1
  - name: random_forest
  - name: extra_trees
  - name: gradient_boosting
  - name: hist_gradient_boosting
evaluation:
  benchmark_strategy: buy_hold
  periods_per_year: 8760
  cost_sensitivity_bps: [0, 5, 10, 20]
  ml_strategy_threshold_sweep:
    enabled: true
    thresholds: [0.50, 0.52, 0.55, 0.58, 0.60, 0.62, 0.65]
    min_exposure_changes: 5
    max_average_exposure_for_active: 0.995
  ml_strategy_tuning:
    enabled: true
    thresholds: [0.50, 0.52, 0.55, 0.58, 0.60, 0.62, 0.65]
    validation_months: 3
    min_validation_rows: 200
    min_exposure_changes: 5
    max_average_exposure_for_active: 0.995
    objective: net_return_and_risk_vs_buy_hold
  walk_forward:
    train_years: 1
    test_months: 3
    step_months: 3
    min_train_rows: 2000
    min_test_rows: 200
    min_train_positive_rate: 0.05
    min_test_positive_rate: 0.05
    embargo_periods: 12
paper:
  enabled: false
